name: build image

# Builds the English MDCx image and publishes it to GHCR, so the NAS never has to build
# anything and updates become: docker compose pull && docker compose up -d
on:
  push:
    branches: [english-i18n]
    paths-ignore:
      - "**.md"
      - "deploy/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mdcx-en

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # build-push-action pushes without leaving the image in the local daemon, so pull it
      # back and verify what was actually published before calling the build good.
      - name: confirm the translation map is in the published image
        run: |
          docker pull "${{ env.IMAGE }}:latest"
          docker run --rm --entrypoint /opt/venv/bin/python "${{ env.IMAGE }}:latest" -c \
            "import json,pathlib;n=len(json.loads(pathlib.Path('/app/mdcx/i18n/en.json').read_text()));print('translation map present:',n,'entries');assert n>800,f'only {n} entries'"
          docker run --rm --entrypoint /bin/sh "${{ env.IMAGE }}:latest" -c \
            "grep -c _bare_to_jinja /app/mdcx/config/migrations.py && grep -c _migrate_naming_marker_flags /app/mdcx/config/migrations.py"
